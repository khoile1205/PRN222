version: '3.9'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    image: caffein-management-app  
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge